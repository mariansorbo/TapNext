<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NextTap by Ferretería Los Andes</title>
<!--
  Página de PRUEBA: muestra la pantalla del tap de un producto de una
  organización (server/index.js → pantallaRedireccion + orgBloque) con un logo
  inventado, sin redirigir a ningún lado. Mismo CSS que la pantalla real.
-->
<style>
  :root{--ink:#14171A;--paper:#EDEFE9;--violet:#7B5CFF;--dur:1200ms}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);
    font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
    min-height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased}
  .mark{display:flex;align-items:baseline;gap:.1em;font-weight:700;
    font-size:clamp(2.9rem,17vw,5.5rem);letter-spacing:-.03em;
    opacity:0;transform:translateY(8px) scale(.97);
    animation:rise .22s cubic-bezier(.2,.7,.2,1) forwards}
  .mark .tap{background:var(--violet);color:var(--ink);padding:.06em .26em .12em;
    border-radius:.16em;clip-path:inset(0 100% 0 0);
    animation:wipe .28s .05s cubic-bezier(.4,0,.1,1) forwards}
  .bar{width:min(150px,40vw);height:2px;border-radius:2px;background:rgba(237,239,233,.16);
    overflow:hidden}
  .bar i{display:block;height:100%;background:var(--violet);
    transform:translateX(-100%);animation:fill var(--dur) linear forwards paused}
  .run .bar i{animation-play-state:running}
  .cta{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;
    bottom:calc(env(safe-area-inset-bottom) + 14px);padding:10px 16px;
    font-size:.9rem;color:rgba(237,239,233,.72);text-decoration:none;
    opacity:0;animation:show .2s .08s forwards}
  .cta b{color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  @keyframes show{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}
  @keyframes fill{to{transform:translateX(0)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
  body.org{gap:22px;padding:24px}
  body.org .mark{font-size:clamp(2rem,11vw,3.3rem)}
  .firma{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .by{font-size:clamp(1rem,4.6vw,1.25rem);color:rgba(237,239,233,.72);max-width:22ch;
    overflow-wrap:anywhere;opacity:0;animation:show .25s .12s forwards}
  .by b{color:var(--paper);font-weight:600}
  .org-img{width:min(72vw,320px,40svh);aspect-ratio:1;border-radius:clamp(16px,6vw,26px);overflow:hidden;
    background:rgba(237,239,233,.06);opacity:0;transform:scale(.96);
    transition:opacity .25s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
  .org-img.ok{opacity:1;transform:none}
  .org-img img{display:block;width:100%;height:100%;object-fit:cover}
  /* Solo de esta página de prueba */
  .prueba{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;font:500 .75rem ui-monospace,SFMono-Regular,Menlo,monospace;
    color:rgba(237,239,233,.5);white-space:nowrap}
  .prueba button{background:none;border:1px solid rgba(237,239,233,.25);color:var(--paper);
    border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
</style>
</head>
<body class="org">
  <div class="prueba">Vista de prueba · no redirige <button type="button" id="otra-vez">Ver de nuevo</button></div>
  <div class="org-img" id="org-img"><img src="/images/logo-prueba-org.svg" alt="Ferretería Los Andes" fetchpriority="high"></div>
  <div class="firma">
    <div class="mark">Next<span class="tap">Tap</span></div>
    <div class="by">by <b>Ferretería Los Andes</b></div>
  </div>
  <div class="bar"><i></i></div>
  <a class="cta" href="/">Comprá el tuyo en <b>next-tap.tech</b></a>
  <script>
  (function(){
    // Mismo arranque que la pantalla real: espera la imagen (tope 1,2 s) y
    // recién ahí corre la barrita de 1,2 s. En vez de redirigir, se queda.
    function listo(cb){
      var box=document.getElementById('org-img'), img=box.querySelector('img'), hecho=false;
      var fin=function(ok){ if(hecho) return; hecho=true; if(ok===false) box.style.display='none'; else box.className+=' ok'; cb(); };
      if(img.complete&&img.naturalWidth) return fin();
      img.onload=function(){ (img.decode?img.decode():Promise.resolve()).then(fin,fin) };
      img.onerror=function(){ fin(false) };
      setTimeout(fin,1200);
    }
    listo(function(){ requestAnimationFrame(function(){requestAnimationFrame(function(){
      document.documentElement.className='run';
    })}) });
    document.getElementById('otra-vez').addEventListener('click', function(){ location.reload(); });
  })();
  </script>
</body>
</html>
