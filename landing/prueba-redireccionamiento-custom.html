<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Prueba — pantalla del tap de organizaciones</title>
<!--
  Página de PRUEBA: carrusel con la pantalla del tap de distintas
  organizaciones (logos inventados en public/images/prueba-logos/, cuadrados,
  apaisados y verticales). Cada logo pasa por el mismo encuadre automático que
  el editor de Mi panel (src/encuadre.js) y el fondo sale del mismo cálculo
  (src/color-logo.js). Mismo CSS que server/index.js → orgBloque. No redirige.
-->
<style>
  :root{--violet:#7B5CFF}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#14171A}
  body{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .carrusel{display:flex;height:100svh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    scrollbar-width:none;overscroll-behavior-x:contain}
  .carrusel::-webkit-scrollbar{display:none}

  /* Una pantalla del tap por slide (body.org → .slide) */
  .slide{flex:0 0 100%;height:100svh;scroll-snap-align:center;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
    background:var(--fondo,#14171A);color:var(--texto,#EDEFE9);transition:background-color .3s ease}
  .org-img{width:min(72vw,320px,40svh);aspect-ratio:1;border-radius:clamp(16px,6vw,26px);overflow:hidden;
    background:var(--pista);box-shadow:0 12px 40px rgba(0,0,0,.18);opacity:0;transform:scale(.96);
    transition:opacity .25s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
  .org-img img{display:block;width:100%;height:100%;object-fit:cover}
  .firma{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .mark{display:flex;align-items:baseline;gap:.1em;font-weight:700;font-size:clamp(2rem,11vw,3.3rem);
    letter-spacing:-.03em;opacity:0;transform:translateY(8px) scale(.97)}
  .mark .tap{background:var(--acento);color:var(--acento-texto);padding:.06em .26em .12em;border-radius:.16em;
    clip-path:inset(0 100% 0 0)}
  .bar{width:min(150px,40vw);height:2px;border-radius:2px;background:var(--pista);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acento);transform:translateX(-100%)}
  .cta{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
    bottom:calc(env(safe-area-inset-bottom) + 44px);padding:10px 16px;font-size:clamp(1rem,4.4vw,1.15rem);
    color:var(--texto2);text-decoration:none;opacity:0}
  .cta b{color:var(--texto);font-weight:600;text-decoration:underline;text-underline-offset:3px}

  /* La animación corre cada vez que el slide queda en pantalla */
  .slide.run .org-img{opacity:1;transform:none}
  .slide.run .mark{animation:rise .22s cubic-bezier(.2,.7,.2,1) forwards}
  .slide.run .mark .tap{animation:wipe .28s .05s cubic-bezier(.4,0,.1,1) forwards}
  .slide.run .cta{animation:show .2s .08s forwards}
  .slide.run .bar i{animation:fill 1200ms .3s linear forwards}
  @keyframes show{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}
  @keyframes fill{to{transform:translateX(0)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

  /* Controles de la prueba (no existen en la pantalla real) */
  .info{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
    font:500 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(237,239,233,.9)}
  .info span{background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
  .puntos{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 108px);left:0;right:0;z-index:2;
    display:flex;justify-content:center;gap:8px}
  .puntos button{width:8px;height:8px;border-radius:999px;border:0;background:rgba(0,0,0,.35);
    box-shadow:0 0 0 1px rgba(255,255,255,.5);cursor:pointer;padding:0;transition:width .2s ease}
  .puntos button.on{background:#fff;width:22px}
  .flecha{position:fixed;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;
    border:0;background:rgba(0,0,0,.4);color:#fff;font-size:1.3rem;cursor:pointer;display:none}
  .flecha.izq{left:16px}.flecha.der{right:16px}
  @media (hover:hover) and (min-width:700px){.flecha{display:block}}
</style>
</head>
<body>
  <div class="info">
    <span>Vista de prueba · no redirige · deslizá →</span>
    <span id="detalle"></span>
  </div>
  <div class="carrusel" id="carrusel"></div>
  <div class="puntos" id="puntos"></div>
  <button type="button" class="flecha izq" id="ant" aria-label="Anterior">‹</button>
  <button type="button" class="flecha der" id="sig" aria-label="Siguiente">›</button>

  <script type="module">
    import { colorMayoritario, paletaPantalla } from '/src/color-logo.js';
    import { encuadreAutomatico } from '/src/encuadre.js';

    // Logos inventados, de distintas formas. Ni el encuadre ni el fondo están
    // escritos acá: se calculan de cada imagen, igual que en el editor de Mi
    // panel cuando la organización sube el archivo y toca "Guardar" sin mover nada.
    const ORGS = [
      { nombre: 'Ferretería Los Andes', logo: 'ferreteria-los-andes.svg' },
      { nombre: 'Transportes del Sur', logo: 'transportes-del-sur.svg' },
      { nombre: 'Heladería Polo', logo: 'heladeria-polo.svg' },
      { nombre: 'Gimnasio Fuerza', logo: 'gimnasio-fuerza.svg' },
      { nombre: 'Café Brasa', logo: 'cafe-brasa.svg' },
      { nombre: 'Lumen Estudio', logo: 'lumen-estudio.svg' },
      { nombre: 'Vivero Verde Raíz', logo: 'vivero-verde-raiz.svg' },
      { nombre: 'Pixel Norte', logo: 'pixel-norte.svg' },
      { nombre: 'Sastrería Ortiz', logo: 'sastreria-ortiz.svg' },
      { nombre: 'Kiosco Doña Rosa', logo: 'dona-rosa.svg' },
    ];

    const carrusel = document.getElementById('carrusel');
    const puntos = document.getElementById('puntos');
    const detalle = document.getElementById('detalle');
    const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    function cargar(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function colorDe(img) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, 128, 128);
      return colorMayoritario(ctx.getImageData(0, 0, 128, 128).data);
    }

    let actual = 0;
    function mostrarDetalle(i) {
      const o = ORGS[i];
      const forma = o.forma ? `${o.forma} · ` : '';
      detalle.textContent = `${i + 1}/${ORGS.length} · ${forma}fondo ${o.color || 'negro de marca (logo sin color)'}`;
    }

    const slides = ORGS.map((o, i) => {
      const s = document.createElement('section');
      s.className = 'slide';
      s.dataset.i = i;
      s.innerHTML = `
        <div class="org-img"><img alt="${esc(o.nombre)}"></div>
        <div class="firma">
          <div class="mark">Next<span class="tap">Tap</span></div>
        </div>
        <div class="bar"><i></i></div>
        <a class="cta" href="/">Comprá el tuyo en <b>next-tap.tech</b></a>`;
      carrusel.appendChild(s);

      const p = document.createElement('button');
      p.type = 'button';
      p.setAttribute('aria-label', o.nombre);
      p.addEventListener('click', () => s.scrollIntoView({ behavior: 'smooth', inline: 'center' }));
      puntos.appendChild(p);

      cargar(`/images/prueba-logos/${o.logo}`).then((img) => {
        // Lo que sube el editor: el cuadrado de 1080 ya encuadrado.
        const cuadro = encuadreAutomatico(img);
        s.querySelector('.org-img img').src = cuadro.canvas.toDataURL('image/png');
        const tipo = cuadro.iw === cuadro.ih ? 'cuadrado' : cuadro.iw > cuadro.ih ? 'apaisado' : 'vertical';
        o.forma = `${tipo} ${cuadro.iw}×${cuadro.ih}${cuadro.modo === 'entera' ? ' → entra entera' : ''}`;
        o.color = colorDe(cuadro.canvas);
        const pal = paletaPantalla(o.color);
        s.style.setProperty('--fondo', pal.fondo);
        s.style.setProperty('--texto', pal.texto);
        s.style.setProperty('--texto2', pal.texto2);
        s.style.setProperty('--pista', pal.pista);
        s.style.setProperty('--acento', pal.acento);
        s.style.setProperty('--acento-texto', pal.acentoTexto);
        if (actual === i) mostrarDetalle(i);
      });
      return s;
    });

    // Slide en pantalla → se repite la animación de la pantalla real.
    function activar(i) {
      actual = i;
      slides.forEach((s, j) => {
        if (j !== i) return s.classList.remove('run');
        s.classList.remove('run');
        void s.offsetWidth;
        s.classList.add('run');
      });
      [...puntos.children].forEach((p, j) => p.classList.toggle('on', j === i));
      mostrarDetalle(i);
    }
    let espera;
    carrusel.addEventListener('scroll', () => {
      clearTimeout(espera);
      espera = setTimeout(() => {
        const i = Math.round(carrusel.scrollLeft / carrusel.clientWidth);
        if (i !== actual || !slides[i].classList.contains('run')) activar(i);
      }, 90);
    });
    activar(0);

    const ir = (d) =>
      slides[Math.max(0, Math.min(slides.length - 1, actual + d))].scrollIntoView({ behavior: 'smooth', inline: 'center' });
    document.getElementById('ant').addEventListener('click', () => ir(-1));
    document.getElementById('sig').addEventListener('click', () => ir(1));
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') ir(1);
      if (e.key === 'ArrowLeft') ir(-1);
    });
  </script>
</body>
</html>
