<style>
:root{--ink:#14171A;--paper:#EDEFE9;--violet:#7B5CFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0d0f;color:var(--paper);font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
 min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.stage{display:flex;align-items:center;gap:18px}
.nav{background:#1e2226;color:var(--paper);border:0;width:52px;height:52px;border-radius:50%;font-size:1.4rem;cursor:pointer}
.nav:hover{background:#2a3036}
.phone{width:300px;height:560px;border-radius:30px;border:6px solid #2a3036;overflow:hidden;position:relative;background:var(--ink)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:var(--paper);background:var(--ink)}
.mark{display:flex;align-items:baseline;gap:.1em;font-weight:700;font-size:2.7rem;letter-spacing:-.03em;opacity:0;transform:translateY(8px) scale(.97);animation:rise .22s cubic-bezier(.2,.7,.2,1) forwards}
.mark .tap{background:var(--violet);color:var(--ink);padding:.06em .26em .12em;border-radius:.16em;clip-path:inset(0 100% 0 0);animation:wipe .28s .05s cubic-bezier(.4,0,.1,1) forwards}
.bar{width:90px;height:2px;border-radius:2px;background:rgba(237,239,233,.16);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);transform:translateX(-100%);animation:fill 800ms linear forwards}
.cta{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:12px;font-size:.72rem;color:rgba(237,239,233,.72);opacity:0;animation:show .2s .08s forwards}
.cta b{color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@keyframes show{to{opacity:1}}@keyframes rise{to{opacity:1;transform:none}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}@keyframes fill{to{transform:translateX(0)}}
.info{text-align:center;min-height:48px}
.info b{font-size:1.05rem}.info small{display:block;opacity:.6;margin-top:4px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:520px}
.dots i{width:8px;height:8px;border-radius:50%;background:#2a3036;cursor:pointer}
.dots i.on{background:var(--paper)}
.hint{opacity:.5;font-size:.8rem}
.tabs{display:flex;gap:8px}
.tabs button{background:#1e2226;color:var(--paper);border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:.9rem;cursor:pointer}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:600}
body.todo{justify-content:flex-start}
body.todo .stage,body.todo .info,body.todo .dots,body.todo .hint{display:none}
#grid{display:none;width:100%;max-width:1040px}
body.todo #grid{display:block}
#grid h2{font-size:1rem;font-weight:600;margin:22px 0 10px;text-transform:capitalize;opacity:.8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--ink);border:1px solid #2a3036;border-radius:16px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card .cd{font-size:.75rem;opacity:.6;letter-spacing:.04em;text-transform:uppercase}
.card .efe{display:flex;flex-direction:column;align-items:center;gap:8px}
.card .efe svg{width:62px!important;height:auto;opacity:1!important;transform:none!important;animation:none!important}
.card .efe svg.ancha{width:100%!important}
.card .efe p{font-size:.78rem!important;opacity:1!important;animation:none!important;min-height:2.4em}
.cmark{font-weight:700;font-size:1.3rem;letter-spacing:-.03em;display:flex;align-items:baseline;gap:.1em}
.cmark .tap{background:var(--violet);color:var(--ink);padding:.06em .26em .12em;border-radius:.16em}
